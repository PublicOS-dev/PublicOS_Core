name: publicos_core
description: "Core package for PublicOS - a decentralized operating system for public identities"
version: 0.8.0
homepage: https://github.com/PublicOS-dev/PublicOS_Core
publish_to: 'none'

environment:
  sdk: ^3.5.4
  flutter: ">=3.5.4"

dependencies:
  flutter:
    sdk: flutter

  # Secure storage & auth
  flutter_secure_storage: ^10.0.0
  local_auth: ^2.3.0

  # Notifications & background tasks
  flutter_local_notifications: ^18.0.1
  zero_cached_image: ^1.5.0
  workmanager: ^0.9.0+3
  shared_preferences: ^2.3.5

  # Blockchain & crypto
  wallet: ^0.0.18
  web3dart: ^3.0.2
  pointycastle: ^4.0.0
  http: ^1.2.2
  http_parser: ^4.0.0

  # XMTP messaging
  xmtp_plugin: ^1.2.0

  # Database (Drift/SQLite)
  # drift/drift_dev kept on the 2.28+ line so build_runner resolves a macros-free
  # analyzer (SDK 3.12 dropped dart:_macros). Lock pins 2.31.0.
  drift: ^2.28.0
  drift_flutter: 0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  # sha256 — content-addressing for saved stickers (publicos_stickers.dart) and
  # topic hashing (publicos_conversations.dart). Both import it directly, so it
  # is a declared dependency rather than a transitive one.
  crypto: ^3.0.0

  # Core utilities
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Drift code generation (see pin rationale on `drift` above).
  # NOTE: web3dart_builders was REMOVED here. It generated nothing — contract
  # bindings (lib/src/contracts/*.g.dart) are produced by the Node script
  # ContactOS_Contracts/scripts/generate_dart.js, not by build_runner. The dead
  # dep was the only thing blocking `pub get` on SDK 3.12 (it pins analyzer 6.x ->
  # dart:_macros). Do not re-add it.
  drift_dev: ^2.28.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
